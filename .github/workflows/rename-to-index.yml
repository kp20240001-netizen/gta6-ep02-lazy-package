name: Rename uploaded file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "kp20240001-netizen"
          git config user.email "kp20240001-netizen@users.noreply.github.com"
          git mv gta6-kuai-su-zhuan-qian-quan-di-tu-lan-ren-bao.html index.html
          git commit -m "Rename uploaded file to index.html"
          git push
